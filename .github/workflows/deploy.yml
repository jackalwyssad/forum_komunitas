name: 🚀 Deploy to cPanel via FTP

on:
  push:
    branches:
      - main  # Ganti dengan nama branch kamu (misal: master)

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode terbaru
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (untuk build frontend React)
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies & Build frontend
      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Frontend (React)
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}  # Opsional: jika pakai env variable

      # 4. Deploy Backend (Laravel) ke cPanel via FTP
      - name: 📤 Deploy Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./backend/             # folder lokal yang di-upload
          server-dir: /public_html/server-api/ # ✅ sesuai struktur hosting kamu
          dangerous-clean-slate: false          # ⛔ JANGAN hapus file di server yang tidak ada di lokal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/storage/app/public/**

      # 5. Deploy Frontend Build ke cPanel via FTP
      - name: 📤 Deploy Frontend Build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./frontend/dist/   # hasil build React (isi dist, bukan foldernya)
          server-dir: /public_html/     # ✅ langsung ke root public_html
          dangerous-clean-slate: false  # ⛔ JANGAN hapus file di server yang tidak ada di lokal
          exclude: |
            **/uploads/**               # 🔒 Lindungi folder gambar upload user (avatars/replies/threads)
            **/server-api/**            # 🔒 Jangan sentuh folder backend
            **/.htaccess                # 🔒 Jangan timpa .htaccess yang sudah ada

      # 6. Setup PHP untuk menjalankan artisan migrate
      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      # 7. Install Composer dependencies
      - name: 📦 Install Composer Dependencies
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader

      # 8. Jalankan Laravel Migration ke database MySQL hosting
      - name: 🗄️ Run Laravel Migration (Remote MySQL)
        working-directory: ./backend
        env:
          APP_ENV: production
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST_PROD }}
          DB_PORT: 3306
          DB_DATABASE: ${{ secrets.DB_DATABASE_PROD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME_PROD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PROD }}
        run: php artisan migrate --force

      # 9. Clear & Optimize Laravel untuk Production
      - name: ⚡ Clear & Optimize Laravel
        working-directory: ./backend
        env:
          APP_ENV: production
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST_PROD }}
          DB_PORT: 3306
          DB_DATABASE: ${{ secrets.DB_DATABASE_PROD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME_PROD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PROD }}
        run: |
          php artisan cache:clear
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          php artisan optimize
